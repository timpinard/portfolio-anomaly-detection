[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "portfolio-anomaly-detection"
version = "0.1.0"
description = "Portfolio risk analysis using dual-model anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Portfolio Analytics Team" }]
dependencies = [
  "anthropic>=0.34",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "torch>=2.2",
  "joblib>=1.3",
  "fastapi>=0.104",
  "uvicorn[standard]>=0.24",
  "pydantic>=2.0",
  "yfinance>=0.2.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7.0",
  "pytest>=8.0",
  "ipython>=8.12",
  "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
